# web-search-mcp server configuration

# default_max_results: default result count when max_results is omitted in request
default_max_results = 5

# max_results_limit: server-side cap on result count
max_results_limit = 20

# search_timeout_sec: MCP-level timeout (seconds) wrapped around the DuckDuckGo provider call
search_timeout_sec = 10.0

# browser_allowed_domains: hostnames permitted for browser_fetch (exact match against the URL's
# hostname). Empty list = deny all (fail-closed). IP-literal, loopback, and link-local
# targets are always rejected regardless of this list (defense in depth).
browser_allowed_domains = []

# browser_max_response_kb: extracted-text response size cap (KB) for browser_fetch; truncated
# (not rejected) beyond this limit, with a truncated=true flag on the response.
browser_max_response_kb = 256

# browser_timeout_sec: HTTP request timeout in seconds for the outbound browser_fetch request.
browser_timeout_sec = 15

# auth_token: Bearer token for MCP server call authentication, resolved from
# the MCP_WEB_SEARCH_AUTH_TOKEN environment variable. Must match
# config/agent.toml's [mcp_servers.web_search].auth_token value (shared secret).
# An empty or missing value makes the server refuse to start.
auth_token = "${ENV:MCP_WEB_SEARCH_AUTH_TOKEN}"

# [dedup]: shared dedup store settings owned by this process (mcpdl003). Values
# must stay identical across all ten *_mcp_server.toml files: the store identity
# fingerprint gate refuses a reopen with drifted values.
[dedup]
db_path = "/opt/llm/db/mcp_dedup.sqlite"
retention_days = 14
pending_timeout_minutes = 10
lease_seconds = 30
max_attempts = 3

# [control]: Agent-only control credential (mcpdl004). It is a separate token
# from the tool auth_token above, so a tool token never reaches a control path.
# An unset variable resolves to an empty token, which closes only control paths.
[control]
auth_token = "${ENV:MCP_WEB_SEARCH_CONTROL_TOKEN}"
