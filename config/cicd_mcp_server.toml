# cicd-mcp server configuration (GitHub Actions backend)

# repo_allowlist: permitted repositories in 'owner/repo' format
# IMPORTANT: empty list = deny all repositories (fail-closed)
# Example: ["myorg/myrepo", "myorg/other-repo"]
repo_allowlist = ["masaos-minori/llmagent"]

# workflow_allowlist: permitted workflow file names (e.g. "ci.yml")
# Fail-closed: empty list = deny all workflow triggers (CicdAuthorizationError).
# Add allowed workflow patterns to enable triggering.
# Example:
# workflow_allowlist = [
#   "deploy.yml",
#   "ci.yml",
# ]
workflow_allowlist = ["ci.yml"]

# max_log_size_kb: maximum log output size in KB (prevents large data dumps)
max_log_size_kb = 256

# auth_token: Bearer token for MCP server call authentication, resolved
# from the MCP_CICD_AUTH_TOKEN environment variable. Must match
# config/agent.toml's [mcp_servers.cicd].auth_token value.
# An empty or missing value makes the server refuse to start.
auth_token = "${ENV:MCP_CICD_AUTH_TOKEN}"

# github_token: fallback when GITHUB_TOKEN env var is unset (not recommended)
# Prefer setting GITHUB_TOKEN via environment variable or config file
github_token = ""

# [dedup]: shared dedup store settings owned by this process (mcpdl003). Values
# must stay identical across all ten *_mcp_server.toml files: the store identity
# fingerprint gate refuses a reopen with drifted values.
[dedup]
db_path = "/opt/llm/db/mcp_dedup.sqlite"
retention_days = 14
lease_seconds = 30
max_attempts = 3

# [control]: Agent-only control credential (mcpdl004). It is a separate token
# from the tool auth_token above, so a tool token never reaches a control path.
# An unset variable resolves to an empty token, which closes only control paths.
[control]
auth_token = "${ENV:MCP_CICD_CONTROL_TOKEN}"
