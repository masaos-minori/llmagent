# --- Architecture-assumption registry (ADR-016 Decision 4) ---
# Applicable-ADR lists record where the assumption is stated in ADR Context/Target Environment
# sections. config-check assertions compare model current_value against config/agent.toml.

[[assumption]]
id = "ARCH-001"
name = "Single-host deployment"
current_value = "Execution on a single host with multiple processes; expected scale is limited concurrency"
applicable_adrs = ["ADR-001", "ADR-002", "ADR-003", "ADR-004", "ADR-007", "ADR-014"]
validation_method = "manual-review"
owner = "Repository owner"
review_triggers = [
  "Deployment changes from a single host to multiple hosts or a distributed configuration",
  "Expected scale exceeds limited concurrency",
]

[[assumption]]
id = "ARCH-002"
name = "Loopback-only MCP exposure"
current_value = "All MCP servers bind only to 127.0.0.1 loopback addresses; exposure beyond localhost is not supported"
applicable_adrs = ["ADR-006", "ADR-007", "ADR-013"]
validation_method = "config-check"
config_keys = ["mcp_servers.*.url"]
owner = "Repository owner"
review_triggers = [
  "An MCP endpoint is exposed beyond localhost",
  "TLS or external-client support is introduced",
]

[[assumption]]
id = "ARCH-003"
name = "Local SQLite storage"
current_value = "All persistent platform state is stored in local SQLite database files under the ADR-008 four-database separation"
applicable_adrs = ["ADR-006", "ADR-008", "ADR-009"]
validation_method = "manual-review"
owner = "Repository owner"
review_triggers = [
  "A persistent store moves to a server-based or remote database",
  "The four-database separation changes",
]

[[assumption]]
id = "ARCH-004"
name = "Single Agent process"
current_value = "One Agent process runs on the host; MCP servers run as separate processes"
applicable_adrs = ["ADR-001", "ADR-003", "ADR-004", "ADR-012", "ADR-014"]
validation_method = "manual-review"
owner = "Repository owner"
review_triggers = [
  "Multiple Agent processes are introduced on the host",
  "Agent-side trust boundaries change",
]
