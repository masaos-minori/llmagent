# Markdown Context Compression Engine MCP Server Configuration

# auth_token: Bearer token for MCP server call authentication, resolved from the
# MCP_MDQ_AUTH_TOKEN environment variable. Must match config/agent.toml's
# [mcp_servers.mdq].auth_token value. An empty or missing value makes the
# server refuse to start (fail closed). allowed_dirs below is a separate path
# authorization applied after authentication; it does not replace it.
auth_token = "${ENV:MCP_MDQ_AUTH_TOKEN}"

# Directories that mdq-mcp is allowed to read from.
# Default: [] (deny-all — no paths are allowed until explicitly configured).
# Production example: allowed_dirs = ["/opt/llm/docs"]
allowed_dirs = ["/opt/llm/docs"]

# Database path
db_path = "/opt/llm/db/mdq.sqlite"

# File matching patterns
include_globs = ["*.md"]
exclude_globs = [".git/**", "__pycache__/**"]

# Maximum number of characters to include in a snippet
max_snippet_chars = 500

# Maximum number of characters to include in a chunk
max_chunk_chars = 10000

# Maximum number of characters to include in a file
max_file_chars = 100000

# Result size limits (enforced at server level before MCP truncation).
# Per-request overrides are bounded above by these config values.

# Maximum number of search results returned per query (default: 100).
max_results_limit = 100

# Maximum characters per chunk returned by get_chunk (default: 10000).
max_chars_per_chunk = 10000

# Maximum total characters across all search results (default: 100000).
max_total_result_chars = 100000

# Maximum outline items returned by the outline tool (default: 500).
max_outline_items = 500

# Maximum grep match results returned by grep_docs (default: 200).
max_grep_matches = 200

# Maximum number of characters per grep match (default: 500).
max_chars_per_match = 500

# Lines of context around a grep match (default: 2 each).
context_before = 2
context_after = 2

# Maximum outline depth returned by the outline tool (default: 6).
max_outline_depth = 6

# Milliseconds to wait for a locked SQLite write (default: 5000).
sqlite_busy_timeout = 5000

# Maximum number of seconds to wait for a search operation
search_timeout_sec = 30

# Enable grep_docs tool (when false, grep_docs returns MdqValidationError).
# Unlike the removed enable_refresh, this flag is actually enforced in
# MdqService.grep_docs() -- see docs/04_mcp_05_05_mdq-enforcement-and-lockdown.md.
enable_grep = true

# Historical notes on config keys removed from this file (audit_log_path,
# concurrency_limit, max_search_results, use_embedding/
# vector_table/embedding_model, summary_cache_enabled/summary_threshold/
# summary_model, enable_refresh, status) have moved to
# docs/mdq_config_history.md.

# [dedup]: shared dedup store settings owned by this process (mcpdl003). Values
# must stay identical across all ten *_mcp_server.toml files: the store identity
# fingerprint gate refuses a reopen with drifted values.
[dedup]
db_path = "/opt/llm/db/mcp_dedup.sqlite"
retention_days = 14
pending_timeout_minutes = 10
lease_seconds = 30
max_attempts = 3

# [control]: Agent-only control credential (mcpdl004). It is a separate token
# from the tool auth_token above, so a tool token never reaches a control path.
# An unset variable resolves to an empty token, which closes only control paths.
[control]
auth_token = "${ENV:MCP_MDQ_CONTROL_TOKEN}"
