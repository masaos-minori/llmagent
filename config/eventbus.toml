# eventbus configuration

port = 8015
db_path = "/opt/llm/db/eventbus.sqlite"
storage_dir = "/opt/llm/storage"
offsets_dir = "/opt/llm/offsets"
deadletter_dir = "/opt/llm/deadletter"
max_retry = 3

# Shared token (required). It is a control-plane credential: it holds only the
# operator, monitoring, and admin roles. It holds no publisher or consumer role,
# so it cannot publish, subscribe, ACK, or NACK.
auth_token = ""

# Per-role tokens (optional, for role-based access control).
# auth_token must always be configured; add the per-role tokens each caller needs.
# Each token grants only its own role:
#   - publisher_token → PUBLISHER role (can publish events)
#   - consumer_token → CONSUMER role (can subscribe, ack, nack); it requires
#     consumer_authorization (and optionally topic_authorization) below
#   - operator_token → OPERATOR role (can manage DLQ, replay)
#   - monitoring_token → MONITORING role (can access /health)
#   - admin_token → operator, monitoring, and admin roles (no publisher or consumer role)
publisher_token = ""
consumer_token = ""
operator_token = ""
monitoring_token = ""
admin_token = ""

# REQ-007: SSE lifecycle configuration
# Heartbeat interval in seconds (default: 30.0)
sse_heartbeat_interval = 30.0
# Idle timeout in seconds (default: 60.0)
sse_idle_timeout = 60.0
