# shell-mcp server configuration

# command_allowlist: permitted command basenames (matched against argv[0]).
# Each entry is gated by a deny-by-default argument-shape contract in
# scripts/mcp_servers/shell/shell_service.py (_COMMAND_ARG_CONTRACT): an argv that
# does not match the command's permitted shape raises ShellAuthorizationError
# before any subprocess launches. An allowlist entry is NOT a safety guarantee.
#   python / python3 : name-only non-executing forms (--version/--help) only;
#                       -c / -m (free-form code) are rejected.
#   pytest           : denied entirely (imports and runs repository code).
#   git              : read-only subcommands only (log, show, status, diff,
#                       blame, ls-files, for-each-ref, rev-parse, cat-file,
#                       tag, branch, push --dry-run); mutating forms (push
#                       without --dry-run, reset, checkout, branch -D/-F) and
#                       unknown subcommands are rejected.
#   ruff / mypy      : static-analysis flag shapes (--help/--fix / --help/--version).
# Operators widen/narrow permitted shapes by editing the Python contract table.
command_allowlist = ["pytest", "python", "python3", "git", "ruff", "mypy"]

# max_timeout_sec: upper bound for request-specified timeout_sec
max_timeout_sec = 300

# max_output_kb: total stdout+stderr output cap (KB)
max_output_kb = 4096

# max_memory_mb: child process virtual memory limit (MB)
max_memory_mb = 512

# shell_cwd_allowed_dirs: directories permitted as cwd
shell_cwd_allowed_dirs = ["/opt/llm/storage"]

# default_cwd: working directory when cwd is not specified in request
default_cwd = "/opt/llm/storage"

# shell_path: PATH environment variable for child processes
shell_path = "/opt/llm/venv/bin:/usr/bin:/bin"

# audit_log_path: audit log file path
audit_log_path = "/opt/llm/logs/shell_audit.log"

# shell_sandbox_backend: "firejail" (required — "none" is never permitted)
# Production: set to "firejail" (requires firejail: apt-get install firejail).
#   Startup raises RuntimeError when backend="firejail" but firejail binary is not in PATH.
shell_sandbox_backend = "firejail"

# env_allowlist: permitted environment variable keys in req.env
# when non-empty, keys not in this list are removed; when empty, env_denylist is used instead
env_allowlist = []

# env_denylist: glob patterns for env keys removed from req.env (active when env_allowlist is empty)
env_denylist = ["LD_PRELOAD", "LD_LIBRARY_PATH", "PYTHONPATH"]

# Commands never inherit the server's environment. They receive only HOME, USER, LOGNAME,
# SHELL, LANG, LC_*, TMPDIR, TMP, TEMP and PATH, plus the req.env entries that pass the
# filters above. Variables named MCP_*, or containing a TOKEN, SECRET, PASSWORD,
# CREDENTIAL or API_KEY word, are always removed, even when listed in req.env.

# execution_user: OS user to run commands as via setuid; "" = run as current process user
# Requires CAP_SETUID (root). When non-empty and service is not root, a warning is logged
# and the setting is ignored (no-op).
execution_user = ""

# kill_policy: how to terminate a timed-out process group
#   "sigterm_then_sigkill" — send SIGTERM, wait kill_grace_sec, then SIGKILL
#   "sigkill_only"         — send SIGKILL immediately (no grace period)
kill_policy = "sigterm_then_sigkill"

# kill_grace_sec: seconds to wait after SIGTERM before escalating to SIGKILL
# Ignored when kill_policy = "sigkill_only".
kill_grace_sec = 2.0
# auth_token: Bearer token for MCP server call authentication, resolved from the
# MCP_SHELL_AUTH_TOKEN environment variable. Must match config/agent.toml's
# [mcp_servers.shell].auth_token value. An empty or missing value makes the
# server refuse to start (fail closed).
auth_token = "${ENV:MCP_SHELL_AUTH_TOKEN}"


# [dedup]: shared dedup store settings owned by this process (mcpdl003). Values
# must stay identical across all ten *_mcp_server.toml files: the store identity
# fingerprint gate refuses a reopen with drifted values.
[dedup]
db_path = "/opt/llm/db/mcp_dedup.sqlite"
retention_days = 14
pending_timeout_minutes = 10
lease_seconds = 30
max_attempts = 3

# [control]: Agent-only control credential (mcpdl004). It is a separate token
# from the tool auth_token above, so a tool token never reaches a control path.
# An unset variable resolves to an empty token, which closes only control paths.
[control]
auth_token = "${ENV:MCP_SHELL_CONTROL_TOKEN}"
