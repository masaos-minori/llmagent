approval_github_allowed_repos = []

# ── System prompts ────────────────────────────────────────────────────────────

system_prompt_tool = "あなたは有能なエンジニアアシスタントです。必要に応じてツールを使って情報を収集し、正確に回答してください。"

# ── Diagnostics ───────────────────────────────────────────────────────────────

[diagnostics]
# Fernet symmetric key for encrypting session_diagnostics.content when
# DiagnosticStore.save(encrypt=True) is used. "" disables encryption (opt-in).
# Accepted posture (Option B, 2026-10-25): encryption stays disabled in production;
# plaintext-with-redaction is formally accepted. See
# docs/23_agent/agent_09_01_data-layer-session-db.md ("Accepted storage posture").
encryption_key = ""
# session_diagnostics rows older than this are purged lazily on each save().
retention_days = 30

[system_prompts]
default  = "あなたは有能なエンジニアアシスタントです。必要に応じてツールを使って情報を収集し、正確に回答してください。"
strict   = "あなたは厳格なエンジニアアシスタントです。事実のみを回答し、不確かな情報は「不明」と答えてください。ツールを積極的に使用して情報を確認してください。"
creative = "あなたは創造的なエンジニアアシスタントです。複数のアプローチや代替案を提案し、自由な発想で問題解決を支援してください。"

# approval_risk_rules is authoritative for approval risk: rules are consulted
# first, and a tool's tool_safety_tiers value is only consulted when no rule
# matches it.
[approval_risk_rules]
write_file = "medium"
edit_file = "medium"
create_directory = "medium"
move_file = "medium"
delete_file = "high"
delete_directory = "high"
shell_run = "high"
github_push_files = "high"
github_create_or_update_file = "high"
github_delete_file = "high"
github_merge_pull_request = "high"
github_create_branch = "medium"
github_create_pull_request = "medium"
github_update_pull_request = "medium"
github_create_issue = "medium"
github_add_issue_comment = "medium"
git_checkout = "high"
git_pull = "high"
git_push = "high"

[approval_resource_keys]
path_keys = [
  "path",
  "file_path",
  "directory_path",
  "source",
  "destination",
]
branch_keys = [
  "branch",
  "base",
  "head",
]

# Tier entries for approval-rule-eligible tools exist for plan-mode blocking and
# the ADR-003 tier-vs-write classification, not for approval-risk escalation
# (defense-in-depth; DT-01 Option A).
