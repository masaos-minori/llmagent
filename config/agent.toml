# agent.toml — agent process configuration
# Previously split across: common, llm, http, rag, context, tools, memory, otel,
# security, system_prompts, tools_definitions, and *_mcp_server transport sections.

# ── Infrastructure (common) ───────────────────────────────────────────────────

rag_db_path = "/opt/llm/db/rag.sqlite"
session_db_path = "/opt/llm/db/session.sqlite"
workflow_db_path = "/opt/llm/db/workflow.sqlite"
sqlite_vec_so = "/opt/llm/sqlite-vec/vec0.so"
embed_url = "http://192.168.11.228:8081"
sqlite_timeout = 30
sqlite_busy_timeout_ms = 30000
sqlite_wal_checkpoint_mode = "TRUNCATE"
sqlite_retention_max_sessions = 100
sqlite_retention_max_age_days = 30
sqlite_archive_dir = "/opt/llm/db/archive"
sqlite_corrupt_archive_max_files = 10
sqlite_corrupt_archive_max_age_days = 30
# Artifact retention (db.artifact_retention): count/age caps per artifact class.
# 0 disables that rule; negative or bool values are rejected at config load.
sqlite_archive_max_files = 14  # rotated archive copies kept; 0 disables count rule
sqlite_archive_max_age_days = 30  # archive age cap; 0 disables age rule
sqlite_drill_artifact_max_files = 14  # drill artifact JSONs kept; 0 disables count rule
sqlite_drill_artifact_max_age_days = 30  # drill artifact age cap; 0 disables age rule
sqlite_quarantine_max_files = 10  # failed-recovery quarantine dirs kept; 0 disables count rule
sqlite_quarantine_max_age_days = 90  # quarantine age cap; 0 disables age rule
# Agent-side stale-pending timeout window in minutes; read by
# workflow_engine.py via AgentConfig.pending_timeout_minutes.
pending_timeout_minutes = 10

# ── LLM endpoints ─────────────────────────────────────────────────────────────

llm_url = "http://192.168.11.228:8080"
llm_retry_base_delay = 1.0

# ── HTTP ──────────────────────────────────────────────────────────────────────

http_timeout = 120.0

# ── RAG pipeline ──────────────────────────────────────────────────────────────

# ── Context ───────────────────────────────────────────────────────────────────

context_char_limit = 8000
context_compress_turns = 4

# ── Tools ─────────────────────────────────────────────────────────────────────

max_tool_turns = 5
serial_tool_calls = false
tool_dedup_max_repeats = 3
tool_cycle_detect_window = 2
tool_error_max_consecutive = 3
tool_error_retry_max = 1
# git and mdq are intentionally unlisted: keys absent from this map fall back
# to DEFAULT_PER_SERVER_CONCURRENCY = 8 (shared/tool_transport_invoker.py).
tool_concurrency_limits = {file_read = 4, file_write = 1, file_delete = 1, shell = 2, web_search = 2, github = 3, rag_pipeline = 4, cicd = 2}
tool_result_max_llm_chars = 8000
tool_results_turn_max_chars = 50000
context_token_limit = 4000
tokenize_url = ""
history_protect_turns = 3
llm_max_tokens = 4096
llm_temperature = 0.2
sse_heartbeat_timeout = 60.0
sse_malformed_retry = 2
sse_reconnect_max = 3
llm_stream_retry_on_heartbeat_timeout = true
llm_stream_retry_on_malformed_chunk = false

# ── Memory ────────────────────────────────────────────────────────────────────

use_memory_layer = true
memory_jsonl_dir = "/opt/llm/memory"
memory_max_inject_semantic = 5
memory_max_inject_episodic = 3
memory_min_importance = 0.5
memory_embed_enabled = true
memory_dedup_threshold = 0.3
memory_local_only = false
memory_embed_timeout_sec = 5.0
memory_max_content_chars = 500
memory_retention_days = 90
memory_max_pinned = 10

# ── Observability ─────────────────────────────────────────────────────────────

otel_enabled = false
otel_endpoint = ""
otel_service_name = "llm-agent"

# ── Security ──────────────────────────────────────────────────────────────────

masked_fields = ["content", "old_text", "new_text"]
# Explicit extension of the plan-mode block: the tool_safety_tiers rule is the
# authority (only READ_ONLY tools pass); this list adds tools blocked regardless
# of tier, redundant under the current tiers by design (DT-03 Option A).
plan_blocked_tools = [
  "write_file",
  "create_directory",
  "delete_file",
  "delete_directory",
  "shell_run",
]
# Protected paths escalate every ruled path-bearing tool to HIGH when the path
# is inside allowed_root; a path outside allowed_root is already denied by the
# path jail before this rule applies (DT-06 Option A).
approval_protected_paths = [
  "/opt/",
  "/etc/",
  "/boot/",
  "/usr/",
  "/bin/",
  "/sbin/",
]
approval_high_risk_branches = [
  "main",
  "master",
  "release",
]
# Auto-approval gates the executable only; the agent-side safe-shape rule in
# scripts/agent/tool_policy.py decides subcommand/flag acceptability, so only
# read-only-by-construction command shapes are auto-approved. Interpreters and test
# runners (python, pytest, uv) are deliberately absent and always prompt.
approval_shell_safe_prefixes = [
  "ls",
  "cat",
  "echo",
  "git",
  "pwd",
  "find",
  "grep",
]
tool_policy_mode = "explicit_allowlist"
allowed_tools = [
  "read_text_file",
  "list_directory",
  "directory_tree",
  "search_files",
  "grep_files",
  "write_file",
  "edit_file",
  "create_directory",
  "move_file",
  "delete_file",
  "delete_directory",
  "shell_run",
  "search_web",
  "github_search_repositories",
  "github_search_code",
  "github_get_file_contents",
  "github_list_issues",
  "github_list_branches",
  "github_create_branch",
  "github_create_issue",
  "github_add_issue_comment",
  "github_push_files",
  "github_create_or_update_file",
  "github_delete_file",
  "github_create_pull_request",
  "github_update_pull_request",
  "github_merge_pull_request",
  "search_docs",
  "get_chunk",
  "outline",
  "stats",
  "grep_docs",
  "index_paths",
  "refresh_index",
  "rag_run_pipeline",
  "rag_debug_pipeline",
  "get_file_info",
  "github_get_commit",
  "github_get_issue",
  "github_get_pull_request",
  "github_list_commits",
  "github_list_pull_requests",
  "github_search_issues",
  "github_search_pull_requests",
  "list_directory_with_sizes",
  "read_media_file",
  "read_multiple_files",
  "rag_list_documents",
  "rag_delete_document",
  "get_workflow_runs",
  "get_workflow_status",
  "get_workflow_logs",
  "trigger_workflow",
  "git_status",
  "git_log",
  "git_diff",
  "git_branch",
  "git_show",
  "git_add",
  "git_commit",
  "git_checkout",
  "git_pull",
  "git_push",
]
approval_dry_run_tools = [
  "write_file",
  "edit_file",
  "create_directory",
  "delete_file",
  "delete_directory",
  "move_file",
  "git_checkout",
  "git_push",
  "github_create_branch",
