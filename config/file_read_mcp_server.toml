# file-read-mcp server configuration

# allowed_dirs: list of directories permitted for access (boundary checked after symlink resolution)
allowed_dirs = ["/opt/llm", "/opt/llm/storage"]

# max_read_bytes: maximum bytes read per file
max_read_bytes = 1000000

# max_tree_depth: maximum recursion depth for directory_tree
max_tree_depth = 5

# max_search_results: maximum number of results returned by search_files
max_search_results = 200
# auth_token: Bearer token for MCP server call authentication, resolved from the
# MCP_FILE_READ_AUTH_TOKEN environment variable. Must match config/agent.toml's
# [mcp_servers.file_read].auth_token value. An empty or missing value makes the
# server refuse to start (fail closed).
auth_token = "${ENV:MCP_FILE_READ_AUTH_TOKEN}"


# [dedup]: shared dedup store settings owned by this process (mcpdl003). Values
# must stay identical across all ten *_mcp_server.toml files: the store identity
# fingerprint gate refuses a reopen with drifted values.
[dedup]
db_path = "/opt/llm/db/mcp_dedup.sqlite"
retention_days = 14
pending_timeout_minutes = 10
lease_seconds = 30
max_attempts = 3

# [control]: Agent-only control credential (mcpdl004). It is a separate token
# from the tool auth_token above, so a tool token never reaches a control path.
# An unset variable resolves to an empty token, which closes only control paths.
[control]
auth_token = "${ENV:MCP_FILE_READ_CONTROL_TOKEN}"
