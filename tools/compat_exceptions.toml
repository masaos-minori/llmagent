# tools/compat_exceptions.toml
#
# Manifest-backed replacement for the former static DEFAULT_ALLOWLIST set that
# lived inside tools/check_compat_shims.py. Each [[compatibility_exceptions]]
# entry is a per-file exemption carrying an owner, a review-by expiry, a removal
# condition, and a category so CI can fail on an expired or incomplete exception
# instead of silently tolerating a stale path. tools/check_compat_shims.py's
# load_exceptions() reads this file and validate_exceptions() enforces the
# schema. Location follows the tools/*_baseline.txt precedent (tool data under
# tools/ is not deployed).
#
# Paths are repo-relative and resolved against the repository root by the loader.
version = "1"

# --- Migrated compatibility-exception entries -------------------------------
# These 20 paths are exactly the DEFAULT_ALLOWLIST entries that still produce a
# finding under check_all(..., allowlist=set(), include_removed_names=True).
# The 4 that do not (docs/22_mcp/mcp_03_06_tool-runtime-availability-metadata.md,
# tests/shared/test_rag_tools_consistency.py, tests/shared/test_route_resolver.py
# produce no finding; tests/agent/test_startup_routing_drift.py was deleted) are
# intentionally omitted.

