# tools/compat_exceptions.toml
#
# Manifest-backed replacement for the former static DEFAULT_ALLOWLIST set that
# lived inside tools/check_compat_shims.py. Each [[compatibility_exceptions]]
# entry is a per-file exemption carrying an owner, a review-by expiry, a removal
# condition, and a category so CI can fail on an expired or incomplete exception
# instead of silently tolerating a stale path. tools/check_compat_shims.py's
# load_exceptions() reads this file and validate_exceptions() enforces the
# schema. Location follows the tools/*_baseline.txt precedent (tool data under
# tools/ is not deployed).
#
# Paths are repo-relative and resolved against the repository root by the loader.
version = "1"

# --- Fixture exception entries ----------------------------------------------
# Each entry below exempts one path that legitimately names a retired mechanism
# as negative-test data (a `fixture` category). Under the no-compatibility
# policy (plan 20261107-064415 REQ-003) only `fixture` entries are permitted:
# production-category entries (compatibility/migration/fallback) are rejected by
# validate_exceptions(). The checker's own source is exempted separately via the
# [checker_self_reference] table below, not via an exception entry.

[[compatibility_exceptions]]
id = "tool-registry-reset-helper"
path = "scripts/shared/tool_registry.py"
reason = "Definition site of test-only reset helper (not a misuse)"
owner = "Repository owner"
expires = "2027-04-22"
removal_condition = "Remove when scripts/shared/tool_registry.py no longer defines the test-only reset helper."
category = "fixture"

