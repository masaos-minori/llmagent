# --- Checker self-reference allowance ---------------------------------------
# The checker's own source carries the removed-name patterns as pattern
# literals, so it must be exempt from matching itself. This is a dedicated
# top-level table, NOT a [[compatibility_exceptions]] entry: it cannot be
# mistaken for a production-category exemption (plan 20261107-064415 REQ-003).
# tools/check_compat_shims.py's load_exceptions() merges these paths into the
# allowlist.
[checker_self_reference]
reason = "The checker's own pattern literals match its own patterns; exempt from self-detection."
paths = ["tools/check_compat_shims.py"]

# --- Symbol-stage allowance -------------------------------------------------
# The report-only --check-doc-symbols stage compares backtick-quoted `func()`
# references in docs/ against definitions under scripts/. Names below are
# referenced in docs but defined outside scripts/ (standard library,
# third-party libraries, or conceptual helpers), so they must not fail the
# stage. tools/check_compat_shims.py's check_doc_symbols() drops these plus any
# name defined under tools/ before reporting.
[symbol_stage_allowance]
reason = "Names referenced in docs/ but defined outside scripts/ (stdlib, third-party libraries, or conceptual helpers); allowed through the report-only --check-doc-symbols stage."
names = [
  "check_port_drift",
  "check_port_range_claim",
  "copy2",
  "isinstance",
  "load_vec",
  "name",
  "read_offset",
  "retry_once_with_delay",
  "to_thread",
  "write_offset",
]
