# Machine-readable component-mandatoriness registry (REQ-002).
# Records the architecture-approved required/non-required classification of each
# MCP server. Derived from the table in docs/23_agent/agent_08_04_configuration-mcp-approval-obs.md;
# criteria themselves remain solely in ADR-004 (Decision Group 3). config/agent.toml
# `required` values are validated against this registry at startup (ADR-004 item 13).
# Authority/placement reconciliation pending adrauth001 (U-1); loader reads one path
# constant, so relocation is a one-file change.
version: 1
entries:
  - component_id: cicd
    classification: required
    failure_category: safety-integrity
    safety_role: Controls CI/CD pipeline tool exposure; fail-closed blocks high-impact automation on posture failure.
    safely_disableable_functions: []
    startup_consequence: abort_startup
    observability:
      - ServiceWarning
      - pipeline fatal outcome
    owner: agent-architecture-owner
    authority_adr: ADR-004
    rationale: Not assessed as satisfying Decision Group 3 item 10; status quo default
