# Machine-readable component-mandatoriness registry (REQ-002).
# Records the architecture-approved required/non-required classification of each
# MCP server. The table in docs/23_agent/agent_08_04_configuration-mcp-approval-obs.md
# is generated from this registry (ADR-004 Decision Group 3 item 13); the criteria
# themselves remain solely in ADR-004 (Decision Group 3). config/agent.toml
# `required` values are validated against this registry at startup (ADR-004 item 13).
# Every entry is classified required by the repository owner instruction recorded in
# ADR-004 Group 7. Two questions stay open as Known Issues in
# docs/00_governance/governance_03_issue-and-uncertainty-management.md: whether
# failure_category should follow ADR-004 Group 2 item 7 (MCP-003) and where this
# registry's authority is documented (MCP-004).
version: 1
entries:
  - component_id: cicd
    classification: required
    failure_category: safety-integrity
    safety_role: Controls CI/CD pipeline tool exposure; fail-closed blocks high-impact automation on posture failure.
    safely_disableable_functions: []
    startup_consequence: abort_startup
    observability:
      - ServiceWarning
      - pipeline fatal outcome
    owner: agent-architecture-owner
    authority_adr: ADR-004
    rationale: Classified required by repository owner instruction 2026-11-10 (ADR-004 Group 7 applicability note, option B); item 10 criteria apply only to a non-mandatory classification
