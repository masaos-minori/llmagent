name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --dev
      - name: Format check
        run: uv run ruff format --check scripts/
      - name: Lint check
        run: uv run ruff check scripts/
      - name: Type check
        run: uv run mypy --no-namespace-packages scripts/ tests/eventbus tools
      - name: Security scan
        run: uv run bandit -r scripts/ -c pyproject.toml -ll
      - name: Architecture check
        run: PYTHONPATH=scripts uv run lint-imports
      - name: SQLite 4DB separation check
        run: uv run python tools/check_db_separation.py
      - name: Generated reference docs drift check
        run: uv run python tools/generate_reference_table.py --check
      - name: Regenerate contract manifests
        run: uv run python tools/generate_reference_table.py --manifests
      - name: Contract manifest drift check
        run: git diff --exit-code registry/manifests/
      - name: ADR authority model check
        run: uv run python tools/check_adr_authority.py
      - name: ADR index generated sections drift check
        run: uv run python tools/generate_adr_authority.py --check
      - name: Module docstring format check
        run: uv run python tools/check_docstrings.py
      - name: Module size check
        run: uv run python tools/check_module_size.py
      - name: Module size check (tools)
        run: uv run python tools/check_module_size.py --scripts-dir tools --baseline tools/check_module_size_tools_baseline.txt
      - name: Config comment length check
        run: uv run python tools/check_config_comment_length.py
      - name: Skill size check
        run: uv run python tools/check_skill_size.py
      - name: Test taxonomy check
        run: uv run python tools/check_test_taxonomy.py
      - name: Pre-commit
        run: uv run pre-commit run --all-files
      - name: Run cited ADR invariant tests
        run: uv run python .github/run_cited_adr_tests.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --dev
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Build sqlite-vec extension
        run: |
          sudo mkdir -p /opt/llm
          sudo chown "$USER" /opt/llm
          # Directories that MCP server postures check on their real deployment path
          # (mdq allowed_dirs, file-delete audit log).
          mkdir -p /opt/llm/docs /opt/llm/logs
          # Pinned to the release production runs, so the extension does not drift.
          SQLITE_VEC_REF=v0.1.10-alpha.4 bash deploy/build_sqlite_vec.sh
      - name: Run tests
        # pytest-cov measures and combines xdist worker processes; plain
        # `coverage run -m pytest -n ...` would not. All tests run, none deselected.
        # continue-on-error keeps the job alive so the report step below can decide the exit
        # code: a characterization failure is report-only (REQ-006), so the pytest step's own
        # exit code must not fail the job before the report is printed.
        continue-on-error: true
        run: uv run pytest -v -n logical --cov=scripts --cov-report= --junitxml=report.xml tests/
      - name: Coverage report
        # A push to master is checked out at the pushed commit, so `origin/master` equals
        # HEAD and diff-cover would see an empty diff and pass. Compare a push against the
        # tip it replaced (`github.event.before`) and a pull request against its base.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          uv run coverage xml
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "${BEFORE_SHA//0/}" != "" ] \
            && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            BASE="$BEFORE_SHA"
          else
            # New ref or a force push that dropped the previous tip: fall back.
            BASE="origin/master"
          fi
          echo "diff-cover base: $BASE"
          uv run diff-cover coverage.xml --compare-branch="$BASE" --fail-under=90
      - name: Test taxonomy report
        # Reads the JUnit XML of the single run above; pytest is not run twice. Prints the
        # characterization section and the contract section grouped by module, then exits
        # non-zero only for a contract failure or a failure in a module that is in neither
        # suite (REQ-006). It is the last step so the coverage and diff-cover steps still run
        # when a contract test fails.
        run: uv run python tools/check_test_taxonomy.py --junit-xml report.xml
