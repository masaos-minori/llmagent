name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --dev
      - name: Format check
        run: uv run ruff format --check scripts/
      - name: Lint check
        run: uv run ruff check scripts/
      - name: Type check
        run: uv run mypy --no-namespace-packages scripts/ tests/eventbus
      - name: Security scan
        run: uv run bandit -r scripts/ -c pyproject.toml -ll
      - name: Architecture check
        run: PYTHONPATH=scripts uv run lint-imports
      - name: SQLite 4DB separation check
        run: uv run python tools/check_db_separation.py
      - name: Generated reference docs drift check
        run: uv run python tools/generate_reference_table.py --check
      - name: ADR authority model check
        run: uv run python tools/check_adr_authority.py
      - name: ADR index generated sections drift check
        run: uv run python tools/generate_adr_authority.py --check
      - name: Module docstring format check
        run: uv run python tools/check_docstrings.py
      - name: Module size check
        run: uv run python tools/check_module_size.py
      - name: Pre-commit
        run: uv run pre-commit run --all-files
      - name: Run cited ADR invariant tests
        run: uv run python .github/run_cited_adr_tests.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --dev
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Build sqlite-vec extension
        run: |
          sudo mkdir -p /opt/llm
          sudo chown "$USER" /opt/llm
          # Directories that MCP server postures check on their real deployment path
          # (mdq allowed_dirs, file-delete audit log).
          mkdir -p /opt/llm/docs /opt/llm/logs
          # Pinned to the release production runs, so the extension does not drift.
          SQLITE_VEC_REF=v0.1.10-alpha.4 bash deploy/build_sqlite_vec.sh
      - name: Run tests
        run: uv run pytest -v
      - name: Coverage report
        run: |
          uv run coverage run -m pytest tests/
          uv run coverage xml
          uv run diff-cover coverage.xml --compare-branch=master --fail-under=90
