name: Overview Docs Consistency

on:
  push:
    paths:
      - "docs/01_overview*.md"
      - "conf.d/**"
      - "tools/check_overview_docs_consistency.py"
  pull_request:
    paths:
      - "docs/01_overview*.md"
      - "conf.d/**"
      - "tools/check_overview_docs_consistency.py"

# Cancel in-progress runs for the same workflow + branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Overview Docs Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Overview docs consistency checks
        run: |
          set -euo pipefail
          python tools/check_overview_docs_consistency.py
