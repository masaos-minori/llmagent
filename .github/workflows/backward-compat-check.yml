name: Backward Compatibility Check

on:
  push:
    paths:
      - "scripts/**/*.py"
      - "docs/**/*.md"
      - "tests/**/*.py"
      - "tools/check_compat_shims.py"
      - "tools/compat_exceptions.toml"
  pull_request:
    paths:
      - "scripts/**/*.py"
      - "docs/**/*.md"
      - "tests/**/*.py"
      - "tools/check_compat_shims.py"
      - "tools/compat_exceptions.toml"

# Cancel in-progress runs for the same workflow + branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Backward Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run backward compatibility check
        run: |
          set -euo pipefail
          python tools/check_compat_shims.py --check-removed-names

      - name: Report stale doc symbol references
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/check_compat_shims.py --check-doc-symbols
