name: Governance Docs Consistency

on:
  push:
    paths:
      - "docs/**/*.md"
      - "tools/check_needs_confirmation_inventory.py"
      - "tools/check_dependency_graph_cycles.py"
  pull_request:
    paths:
      - "docs/**/*.md"
      - "tools/check_needs_confirmation_inventory.py"
      - "tools/check_dependency_graph_cycles.py"

# Cancel in-progress runs for the same workflow + branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Governance Docs Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Needs Confirmation inventory checks
        run: |
          set -euo pipefail
          python tools/check_needs_confirmation_inventory.py

      - name: Run dependency graph cycle check
        run: |
          set -euo pipefail
          python tools/check_dependency_graph_cycles.py
