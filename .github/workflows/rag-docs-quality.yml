name: RAG Docs Quality

on:
  push:
    paths:
      - "docs/21_rag/rag_03_*.md"
      - "tools/check_docs_quality.py"
      - "config/doc_quality_rules.json"
  pull_request:
    paths:
      - "docs/21_rag/rag_03_*.md"
      - "tools/check_docs_quality.py"
      - "config/doc_quality_rules.json"

# Cancel in-progress runs for the same workflow + branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: RAG Docs Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run RAG docs quality checks
        run: |
          set -euo pipefail
          python tools/check_docs_quality.py docs/21_rag/rag_03_*.md
