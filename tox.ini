[tox]
envlist = lint, typecheck, tests
skip_missing_interpreters = true

[testenv]
deps =
    pytest
    pytest-asyncio
    pytest-cov
    pytest-mock
    pytest-randomly
    pytest-rerunfailures
    pytest-subprocess
    pytest-testmon
    pytest-timeout
    pytest-xdist
    coverage
    diff-cover
    ruff
    mypy
    pyright
    bandit
    pre-commit
commands =
    tests: uv run pytest {posargs}
    lint: uv run ruff format --check scripts/
    lint: uv run ruff check scripts/
    typecheck: uv run mypy --no-namespace-packages scripts/
    typecheck: uv run pyright scripts/

[testenv:lint-chunks-ft]
description = Check for direct chunks_fts INSERT/UPDATE outside sanctioned paths
skip_install = true
deps =
    rg  # ripgrep must be available in PATH
allowlist_externals = uv
commands =
    rg --no-config --column --line-number --only-matching '(?i)(INSERT|UPDATE)\s+INTO\s+chunks_fts\b' scripts/ --glob '!**/schema_sql.py' --glob '!**/mdq/**'

[testenv:lint-chunks-ftss]
description = Check for direct chunks_fts operations outside sanctioned paths
deps =
    {[testenv]deps}
allowlist_externals =
    uv
commands =
    uv run python tools/check_chunks_fts_invariant.py